# Set POSTGRES_USER, POSTGRES_PASSWORD, and POSTGRES_DB in the shell
# or in a gitignored .env file next to this compose file.
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: social-temp-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: social-temp-backend
    restart: always
    ports:
      - "3005:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - IS_DOCKER=true
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
